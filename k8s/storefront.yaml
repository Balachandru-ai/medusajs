apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-storefront
  namespace: medusa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medusa-storefront
  template:
    metadata:
      labels:
        app: medusa-storefront
    spec:
      containers:
      - name: medusa-storefront
        image: medusa-storefront:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: MEDUSA_BACKEND_URL
          value: http://medusa-backend:9000
        - name: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: medusa-secrets
              key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: medusa-storefront
  namespace: medusa
spec:
  selector:
    app: medusa-storefront
  ports:
  - port: 8000
    targetPort: 8000
  type: NodePort
